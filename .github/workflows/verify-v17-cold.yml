name: Verify V17 anonymous cold pull before authorized retry
on:
  push:
    branches: [submission/t4-v17]
    paths:
      - '.github/workflows/verify-v17-cold.yml'
      - 'scripts/verify_v17_cold.py'
permissions:
  contents: write
concurrency:
  group: t4-v17-cold-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned official public verifier
        run: |
          git clone https://github.com/Agenthon-2026/track4-analysis-public.git test-output/retry-official
          git -C test-output/retry-official checkout --detach 458bc07efc05983de342ccb371e2b3cd793d621f
          python -m pip install 'qfbench2-common @ git+https://github.com/Agenthon-2026/Agenthon2026-public.git@v2.5.1#subdirectory=common'
          python -m pip install ./test-output/retry-official
      - name: Pull without credentials or cached submission and validate all public units
        run: python scripts/verify_v17_cold.py
      - name: Save verification receipt
        if: always()
        run: |
          if test -f research/v17-release/cold-validation.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/v17-release/cold-validation.json
            git commit -m 'Record V17 cold image and official verifier checks'
            git push origin HEAD:refs/heads/submission/t4-v17
          fi
