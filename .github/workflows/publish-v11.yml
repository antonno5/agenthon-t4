name: Publish and verify authorized V11 diagnostic
on:
  push:
    branches: [submission/t4-v11]
    paths:
      - 'Dockerfile.v11'
      - 'agent_submit_v11/**'
      - 'agent_submit_v8/**'
      - 'agent_submit_v7/**'
      - 'agent_submit/**'
      - 'agent_v2/**'
      - 'V11_PROVENANCE.md'
      - 'scripts/ci_release_v11.py'
      - 'research/v11-release/expected-answers.json'
      - 'research/v11-release/runtime-source.json'
      - '.github/workflows/publish-v11.yml'
permissions:
  contents: write
  packages: write
concurrency:
  group: t4-v11-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, check and publish
        run: python scripts/ci_release_v11.py
      - name: Save publication receipt to submission branch
        if: always()
        run: |
          if test -f research/v11-release/publication.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/v11-release/publication.json
            git commit -m 'Record V11 publication verification'
            git push origin HEAD:refs/heads/submission/t4-v11
          fi
